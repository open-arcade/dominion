 spawn(a,b,k,w,()=>{boom(b,A.col,win);RG.push({x:C[b][0],y:C[b][1],r:6,c:A.col});sfx.boom();if(win)sfx.win2();if(l)setTimeout(sfx.coin,300);if(l)FL.push({x:C[b][0],y:C[b][1]-22,m:'💰 +'+l,l:80});vo[b]=P[b].o;dirty=1;shake=win?7:3});return win}
function move(a,b){const s=P[a],t=P[b],n=N[1];
 if(s.mv)return say('Those troops already moved this turn.');
 if(sea(a,b)&&!s.port)return say(`Build a port in ${PR[a].n} to send ships.`);
 const k=Math.min(s.t-1,Math.ceil(s.t*pct/100));if(k<1)return say('Not enough troops to send.');
 if(t.o==1){s.t-=k;t.t+=k;t.mv=1;spawn(a,b,k,1,()=>{})}
 else if(t.o==0||n.war[t.o]){s.t-=k;s.mv=1;const w=fight(1,a,b,k);P[b].mv=1;log(w?`Victory! You capture ${PR[b].n}.`:`Your attack on ${PR[b].n} was repelled.`)}
 else return say(`${N[t.o].name} is not at war with you. Declare war first.`);
 hd=1;ui()}
const val=i=>Math.round(P[i].w*40+P[i].t*2+(P[i].port?40:0)),buyPrice=i=>{const o=P[i].o;return o==0?val(i):Math.round(val(i)*Math.max(1.2,1.7-N[o].rel/200))};
function xfer(i,to){P[i].o=to;P[i].mv=1;vo[i]=to;dirty=1;hd=1;RG.push({x:C[i][0],y:C[i][1],r:6,c:N[to].col});FL.push({x:C[i][0],y:C[i][1]-18,m:'💰',l:70});sfx.coin()}
function buy(i){const n=N[1],p=P[i],o=p.o,pr=buyPrice(i);
 if(o==1||!adj[i].some(j=>P[j].o==1))return say('You can only buy provinces bordering your realm.');
 if(n.gold<pr)return say(`You need ${pr} gold.`);
 if(o>0){const s=N[o];if(s.war[1])return say(`${s.name} will not sell while at war.`);
  if(p.cap||cnt(o)<3||s.rel<-30||R()>.75+s.rel/200){s.rel-=2;return say(`${s.name} refuses to sell ${PR[i].n}.`)}
  s.gold+=pr;s.rel=Math.min(100,s.rel+5)}
 n.gold-=pr;xfer(i,1);log(`You buy ${PR[i].n} for ${pr} gold.`);ui()}
function sell(i,b){const n=N[1],p=P[i],x=N[b],pr=Math.round(val(i)*.8);
 if(p.o!=1||p.cap||cnt(1)<2||x.war[1]||x.gold<pr||x.dead)return say('That sale cannot go ahead.');
 x.gold-=pr;n.gold+=pr;xfer(i,b);x.rel=Math.min(100,x.rel+3);log(`You sell ${PR[i].n} to ${x.name} for ${pr} gold.`);ui()}
function propose(i){const n=N[i],w=n.war[1];let s=n.rel/50+(pow(1)-pow(i))/(pow(1)+pow(i)+1)*1.5+(w?n.wt*.06:0)+(R()-.5)*.7;if(n.offer)s=1;
 if(s>0){setWar(1,i,0);setTr(1,i,10);n.rel=Math.min(100,n.rel+10);n.wt=0;n.offer=0;log(w?`Peace with ${n.name}! A 10-turn treaty is signed.`:`${n.name} signs a 10-turn treaty with you.`)}
 else{n.rel-=3;log(`${n.name} rejects your proposal.`)}}
function ai(i){const n=N[i];
 if(R()<.07){const c=[...new Set(P.flatMap((p,j)=>p.o==i?adj[j].map(k=>P[k].o):[]))].filter(o=>o>1&&o!=i&&!N[o].dead&&!n.war[o]&&!(n.tr[o]>0));
  if(c.length){const o=c[ri(0,c.length-1)];setWar(i,o,1);if(o==1){n.wt=0;log(`${n.name} declares war on you!`,1)}}}
 if(n.war[1]&&pow(i)<pow(1)*.7&&R()<.2&&!n.offer){n.offer=1;log(`${n.name} offers you peace.`)}
 const own=P.map((p,j)=>j).filter(j=>P[j].o==i),hostile=k=>P[k].o!=i&&(P[k].o==0||n.war[P[k].o]),fr=own.filter(j=>adj[j].some(hostile)),hot=fr.length?fr:own;own.forEach(j=>{if(!P[j].port&&n.gold>=PC&&R()<.4&&adj[j].some(k=>sea(j,k)&&hostile(k))){n.gold-=PC;P[j].port=1}});
 while(n.gold>=cost(n)+20&&n.mp>=10){n.gold-=cost(n);n.mp-=10;P[hot[ri(0,hot.length-1)]].t+=10}
 if(n.gold>150&&R()<.5){const k=['atk','def','eco'][ri(0,2)],c=60*(n[k]+1);if(n[k]<5&&n.gold>=c){n.gold-=c;n[k]++}}
 own.sort(()=>R()-.5).forEach(j=>{const s=P[j];if(s.o!=i)return;const tg=adj[j].filter(k=>hostile(k)&&(!sea(j,k)||s.port));
  if(!tg.length){if(s.t>4&&!fr.includes(j)){const f=adj[j].filter(k=>P[k].o==i&&(!sea(j,k)||s.port)),q=f.filter(k=>fr.includes(k)),z=q.length?q:f;if(z.length){const d=z[ri(0,z.length-1)];spawn(j,d,s.t-1,i,()=>{});P[d].t+=s.t-1;s.t=1}}return}
  if(s.t<6)return;tg.sort((a,b)=>P[a].t-P[b].t);const k=tg[0],send=Math.floor(s.t*.85);
  if(send*bon(n)*(sea(j,k)?.85:1)>P[k].t*dbon(N[P[k].o])*P[k].d*1.4){s.t-=send;fight(i,j,k,send)}})}
function endTurn(){if(over||mode!='play')return;tone(70,.25,'sine',.15,40);
 for(let i=2;i<N.length;i++)if(!N[i].dead)ai(i);
 T++;P.forEach(p=>p.mv=0);{const left=MAXT-T+1;if([60,45,30,20,10,5,4,3,2,1].includes(left)){log(`⏳ ${left} turn${left>1?'s':''} left!`,left<=10);tone(left<=5?660:440,.18,'square',.07)}}
 N.forEach(n=>{if(!n.id||n.dead)return;n.gold=Math.max(0,n.gold+inc(n.id));n.mp=Math.min(300,n.mp+cnt(n.id)*2);
  for(const o in n.tr)if(n.tr[o]>0&&n.id<+o)setTr(n.id,+o,n.tr[o]-1);
  if(n.id>1){n.rel+=n.rel>0?-1:n.rel<0?1:0;n.wt=n.war[1]?n.wt+1:0;if(n.offer&&R()<.4)n.offer=0}});
 for(let i=2;i<N.length;i++)for(let j=i+1;j<N.length;j++)if(N[i].war[j]&&R()<.08){setWar(i,j,0);setTr(i,j,8)}
 chk();hd=1;ui()}
function chk(){const t=cnt(1);let m='';
 if(!t)m='Your realm has fallen.';
 else if(t>=PR.length*.5||N.every(x=>x.id<2||x.dead))m='Victory! You dominate Europe.';
 else if(T>MAXT){const b=N.filter(x=>x.id&&!x.dead).sort((a,c)=>cnt(c.id)-cnt(a.id))[0];m=b.id==1?'Victory on points! You hold the most territory.':`${b.name} holds the most territory. You lose.`}
 if(m){over=1;$('#end').hidden=false;$('#end h2').textContent=m}}
build();fui();requestAnimationFrame(frame);
